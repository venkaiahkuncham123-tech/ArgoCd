apiVersion: v1
kind: Pod
metadata:
  name: argocd-pod
  labels:
    purpose: test
spec:
   containers:
    - image: nginx
      ports:
        - contianerPort: 80
      name: nginx-container
---
apiVersion: v1
kind: Pod
metadata:
  name: jenkins
  labels:
    purpose: test
spec:
  containers:
    - image: jenkins/jenkins:lts
      ports:
        - contianerPort: 8080
      name: jenkins-contianer
      
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP 
      name: nginx-front-end-port
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: jenkins-port
  selector:
    purpose: test
